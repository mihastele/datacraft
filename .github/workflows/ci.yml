name: Java foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build, test, and verify core boundaries
        shell: bash
        run: bash ./gradlew --no-daemon --console=plain clean build
      - name: Real PostgreSQL, MySQL and MariaDB adapter verification
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./gradlew --no-daemon --console=plain integrationTest
      - name: JavaFX workflows against all four database choices
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a bash ./gradlew --no-daemon --console=plain :datacraft-desktop:desktopTest
